name: 🖥️ Build and Release Jarvis Installer

on:
  workflow_dispatch:

# Building project code never needs repository write permissions.
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer (trusted main or release tag)
    if: ${{ github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: 🛰️ Checkout selected trusted ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag belongs to main history
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor $env:GITHUB_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release tags must point to a commit reachable from main."
            exit 1
          }

      - name: 📦 Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 🐍 Set up Python
        run: uv python install 3.13

      - name: 🔧 Install dependencies
        shell: pwsh
        run: |
          uv venv
          uv pip install pyinstaller bcrypt==4.0.1 passlib[bcrypt]==1.7.4
          if (Test-Path "requirements.txt") { uv pip install -r requirements.txt }

      - name: 🔍 Verify project structure
        shell: pwsh
        run: |
          Write-Host "📁 Workspace: $(Get-Location)"
          if (Test-Path "app/runtime/pipeline_runner.py") {
            Write-Host "[OK] pipeline_runner.py found."
          } else {
            Write-Error "pipeline_runner.py not found in app/runtime/"
            exit 1
          }

      - name: 🧠 Run JARVIS installer pipeline
        env:
          PIPELINE: build_installer
          PIPELINE_STRICT: "true"
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$(Get-Location)"
          uv run python app/runtime/pipeline_runner.py

      - name: ✅ Verify build artifact
        shell: pwsh
        run: |
          if (Test-Path "dist\Jarvis_Installer.exe") {
            $item = Get-Item "dist\Jarvis_Installer.exe"
            Write-Host "✓ Executable built successfully: $($item.FullName)"
          } else {
            Write-Error "Executable not found in dist/"
            exit 1
          }

      - name: 📦 Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: Jarvis_Installer
          path: dist/Jarvis_Installer.exe
          retention-days: 30
          if-no-files-found: error
          compression-level: 6

  publish-release:
    name: Publish release (tag only)
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success' }}
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: Jarvis_Installer
          path: release-artifact

      - name: 🏷️ Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release-artifact/Jarvis_Installer.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
