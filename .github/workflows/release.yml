name: 🖥️ Build and Release Jarvis Installer

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 🛰️ Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}

      - name: 📦 Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 🐍 Set up Python
        run: uv python install 3.13

      - name: 🔧 Install dependencies
        run: |
          uv venv
          # Dependências explícitas + projeto
          uv pip install pyinstaller bcrypt==4.0.1 passlib[bcrypt]==1.7.4
          if (Test-Path "requirements.txt") { uv pip install -r requirements.txt }
        shell: pwsh

      - name: 🔍 Verificar estrutura do projeto
        run: |
          Write-Host "📁 Workspace: $(Get-Location)"
          Write-Host "Verificando arquivos esperados..."
          if (Test-Path "app/runtime/pipeline_runner.py") {
            Write-Host "[OK] pipeline_runner.py encontrado."
          } else {
            Write-Host "[ERROR] pipeline_runner.py não encontrado em app/runtime/"
            ls -Recurse
            exit 1
          }
          if (Test-Path "main.py") {
            Write-Host "[OK] main.py encontrado na raiz."
          } else {
            Write-Host "[WARN] main.py não encontrado na raiz; o pipeline pode ser o ponto de entrada esperado."
          }
        shell: pwsh

      # 🔑 AQUI entra o mesmo padrão do pipeline funcional
      - name: 🧠 Run JARVIS Pipeline (Build Installer)
        env:
          PIPELINE: build_installer
          PIPELINE_STRICT: "true"

        run: |
          Write-Host "📁 Workspace: $(Get-Location)"
          Write-Host "🐍 Python:"
          uv run python --version
          Write-Host "🧠 Pipeline selecionado: $env:PIPELINE"

          # Garante que o pacote 'app' é resolvível
          $env:PYTHONPATH = "$(Get-Location)"

          $PIPELINE_RUNNER = "app/runtime/pipeline_runner.py"

          if (Test-Path $PIPELINE_RUNNER) {
            Write-Host "🚀 Executando pipeline JARVIS..."
            uv run python $PIPELINE_RUNNER
            Write-Host "✅ Pipeline executado com sucesso."
          } else {
            Write-Host "❌ Erro: pipeline_runner.py não encontrado em app/runtime/"
            exit 1
          }

      - name: ✅ Verify build
        run: |
          if (Test-Path "dist\Jarvis_Installer.exe") {
            $item = Get-Item "dist\Jarvis_Installer.exe"
            Write-Host "✓ Executable built successfully: $($item.FullName)"
          } else {
            Write-Host "✗ Executable not found in dist/"
            exit 1
          }
        shell: pwsh

      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Jarvis_Installer
          path: dist/Jarvis_Installer.exe
          retention-days: 30
          if-no-files-found: error
          compression-level: 6      # Release só é criada quando o fluxo é acionado a partir de uma tag v*.
      # Se o objetivo for criar release também no workflow_dispatch sem tag,
      # ajuste este `if` ou adicione um step de criação de tag antes.
      - name: 🏷️ Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Jarvis_Installer.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
