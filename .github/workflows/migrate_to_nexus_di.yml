name: 🔄 Migrate to Nexus DI (dry-run only)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Nexus DI migration preview
        run: |
          set -euo pipefail
          python scripts/migrate_to_nexus_di.py --dry-run --report nexus_di_migration_report.txt

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nexus-di-migration-report-${{ github.run_id }}
          path: |
            nexus_di_migration_report.txt
            migrate_nexus_di.log
          if-no-files-found: warn
          retention-days: 30

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Nexus DI migration preview"
            echo ""
            echo "Mode: **DRY-RUN ONLY**"
            echo ""
            echo "No repository files were modified and no commit or push was attempted."
            echo "Download the report artifact to review proposed changes."
          } >> "$GITHUB_STEP_SUMMARY"
