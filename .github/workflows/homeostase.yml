name: "🧬 JARVIS Self Healing V3"

on:
  workflow_run:
    workflows:
      - "Copilot coding agent"
      - "Copilot code review"
      - "Repo Lifecycle Governance"
      - "☁️ Sync JARVIS to Google Drive"
      - "💎 JARVIS: Crystallizer"
      - "🖥️ Build and Release Jarvis Installer"
      - "🚀 JARVIS Integrated Evolution"
      - "🧬 Validação — Auto-Evolução e Multi-LLM"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      error_log:
        description: "Log de erro da produção"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: jarvis-homeostasis-trusted
  cancel-in-progress: false

jobs:
  homeostasis:
    name: "🧪 Vistoria e Auto-Cura (trusted main only)"
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (
            github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'schedule' ||
            github.event.workflow_run.event == 'workflow_dispatch'
          ) &&
          (
            github.event.workflow_run.conclusion == 'failure' ||
            github.event.workflow_run.conclusion == 'timed_out' ||
            github.event.workflow_run.conclusion == 'cancelled'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: 🛰️ Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: 🔍 Verificação de Gatilho
        id: gatekeeper
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEALER_GIT_NAME: "JARVIS"
        run: |
          set -e
          LAST_COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an' 2>/dev/null || true)
          LAST_COMMIT_EMAIL=$(git log -1 --pretty=format:'%ae' 2>/dev/null || true)
          if [[ "$LAST_COMMIT_AUTHOR" == "$HEALER_GIT_NAME" ]] || [[ "$LAST_COMMIT_EMAIL" == "jarvis@simbiose.ai" ]]; then
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "Último commit foi do JARVIS. Pulando para evitar loop."
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_run" ]] &&
               { [[ "$WORKFLOW_CONCLUSION" == "failure" ]] ||
                 [[ "$WORKFLOW_CONCLUSION" == "timed_out" ]] ||
                 [[ "$WORKFLOW_CONCLUSION" == "cancelled" ]]; }; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ⚙️ Configurar Identidade JARVIS
        if: steps.gatekeeper.outputs.authorized == 'true'
        run: |
          git config --global user.name "JARVIS"
          git config --global user.email "jarvis@simbiose.ai"

      - name: 📦 Setup UV
        if: steps.gatekeeper.outputs.authorized == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"

      - name: 🔧 Instalação do DNA
        if: steps.gatekeeper.outputs.authorized == 'true'
        run: |
          uv venv --clear --python 3.11
          uv pip install -r requirements/core.txt pytest 'pytest-asyncio>=0.23.0' pytest-json-report pytest-cov anyio autopep8 requests pillow opencv-python-headless 'mcp>=1.26,<2'

      - name: 🔍 Buscar Logs do Workflow com Falha
        if: steps.gatekeeper.outputs.authorized == 'true' && github.event_name == 'workflow_run'
        id: fetch_failed_logs
        env:
          GH_TOKEN: ${{ secrets.GIT_PAT || github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          LOGS_FILE="failed_workflow_logs.txt"
          printf '# Workflow com Falha: %s\n' "$WORKFLOW_NAME" > "$LOGS_FILE"
          printf '# Run ID: %s | SHA: %s\n\n' "$RUN_ID" "$WORKFLOW_SHA" >> "$LOGS_FILE"
          FAILED_JOBS_FILE="/tmp/failed_jobs.txt"
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion=="failure") | "\(.id) \(.name)"' > "$FAILED_JOBS_FILE" 2>/dev/null || true
          if [ ! -s "$FAILED_JOBS_FILE" ]; then
            echo "Nenhum job com falha encontrado ou indisponível." >> "$LOGS_FILE"
          fi
          while IFS=' ' read -r job_id job_name; do
            [ -z "$job_id" ] && continue
            printf '=== JOB: %s (ID: %s) ===\n' "$job_name" "$job_id" >> "$LOGS_FILE"
            if gh api "repos/$REPOSITORY/actions/jobs/$job_id/logs" --header "Accept: application/vnd.github.v3.raw" >> "$LOGS_FILE" 2>/dev/null; then
              true
            else
              printf 'Log indisponível para job %s\n' "$job_id" >> "$LOGS_FILE"
            fi
            echo "" >> "$LOGS_FILE"
          done < "$FAILED_JOBS_FILE"
          echo "logs_file=$LOGS_FILE" >> "$GITHUB_OUTPUT"
          if [ -s "$LOGS_FILE" ]; then
            echo "has_logs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_logs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔄 Ciclo de Auto-Cura e Testes
        if: steps.gatekeeper.outputs.authorized == 'true'
        id: healing_process
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PRODUCTION_ERROR_LOG: ${{ inputs.error_log }}
          PYTHONPATH: "."
        run: |
          set -e
          PYTEST_ARGS=(--ignore=tests/test_engine.py --ignore=tests/test_system_commands.py)
          set +e
          uv run pytest "${PYTEST_ARGS[@]}" --json-report --json-report-file="$RUNNER_TEMP/report.json" > "$RUNNER_TEMP/pytest_log.txt" 2>&1
          PYTEST_EXIT=$?
          set -e
          echo "::group::Resumo do pytest (1ª execução, exit=$PYTEST_EXIT)"
          tail -n 40 "$RUNNER_TEMP/pytest_log.txt" || true
          echo "::endgroup::"
          PRODUCTION_LOG_ARGS=()
          if [[ -n "$PRODUCTION_ERROR_LOG" ]]; then
            printf '%s\n' "$PRODUCTION_ERROR_LOG" > production_error.log
            PRODUCTION_LOG_ARGS=(--production-log production_error.log)
          fi
          WORKFLOW_LOG_ARGS=()
          if [[ -f "failed_workflow_logs.txt" ]]; then
            WORKFLOW_LOG_ARGS=(--workflow-log failed_workflow_logs.txt)
          fi
          set +e
          uv run python scripts/jarvis_healer.py --report "$RUNNER_TEMP/report.json" --log "$RUNNER_TEMP/pytest_log.txt" "${PRODUCTION_LOG_ARGS[@]}" "${WORKFLOW_LOG_ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/healer.log"
          HEALER_EXIT=${PIPESTATUS[0]}
          set -e
          if [[ $HEALER_EXIT -ne 0 ]]; then
            echo "::warning::healer terminou sem corrigir (exit $HEALER_EXIT)"
          fi
          unset GROQ_API_KEY GEMINI_API_KEY OPENROUTER_API_KEY MISTRAL_API_KEY
          set +e
          uv run pytest "${PYTEST_ARGS[@]}" --json-report --json-report-file="$RUNNER_TEMP/report_final.json" > "$RUNNER_TEMP/final_log.txt" 2>&1
          FINAL_EXIT=$?
          set -e
          echo "::group::Resumo do pytest (final)"
          tail -n 40 "$RUNNER_TEMP/final_log.txt" || true
          echo "::endgroup::"
          echo "pytest_exit_final=$FINAL_EXIT"
          if [[ $FINAL_EXIT -ne 0 && -f "$RUNNER_TEMP/healer.log" ]]; then
            uv run python scripts/jarvis_recovery_cli.py --restore-from-log "$RUNNER_TEMP/healer.log" || echo "::warning::recuperação automática incompleta; intervenção necessária"
          fi
          if [[ $FINAL_EXIT -eq 0 ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=partial" >> "$GITHUB_OUTPUT"
          fi

      - name: 🛠️ Criar branch e Pull Request da correção
        if: steps.gatekeeper.outputs.authorized == 'true' && steps.healing_process.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GIT_PAT }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          gh auth setup-git
          git add -- app scripts tests docs
          git rm -r --cached .pytest_cache htmlcov .venv_tests logs backups 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "fix(jarvis): auto-cura proposta via $EVENT_NAME [run $GITHUB_RUN_ID]"
            HEAL_BRANCH="jarvis/heal-$GITHUB_RUN_ID"
            git switch -c "$HEAL_BRANCH"
            git push origin "HEAD:$HEAL_BRANCH"
            gh pr create --title "JARVIS: Auto-Cura (run $GITHUB_RUN_ID)" --body "Correção automática proposta após validação em código confiável da main. Revisão humana e CI permanecem obrigatórios." --head "$HEAL_BRANCH" --base main
          else
            echo "Nenhuma alteração elegível necessária."
          fi

      - name: ✅ Verifica resultado do pytest
        if: steps.gatekeeper.outputs.authorized == 'true' && steps.healing_process.outputs.status != 'success'
        run: |
          echo "Testes não passaram após a auto-cura (status=${{ steps.healing_process.outputs.status }})."
          exit 1

      - name: 💤 Standby
        if: steps.gatekeeper.outputs.authorized == 'false'
        run: echo "Sistemas estáveis."
