name: Supabase message claim fencing tests

on:
  pull_request:
    branches: [main]
    paths:
      - "app/multiagent/supabase_queue.py"
      - "app/multiagent/transport.py"
      - "app/multiagent/worker.py"
      - "supabase/migrations/20261107010000_multi_agent_message_claim_fencing.sql"
      - "supabase/tests/message_claim_fencing.test.sql"
      - "tests/multiagent/test_supabase_message_process_e2e.py"
      - "requirements/core.txt"
      - "requirements/dev.txt"
      - ".github/workflows/supabase-message-claim-fencing-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-message-claim-fencing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    name: PostgreSQL message claim fencing tests (isolated local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Assemble isolated migration fixture
        shell: bash
        run: |
          set -euo pipefail
          test_dir="${RUNNER_TEMP}/jarvis-message-claim-fencing"
          mkdir -p "${test_dir}"
          cd "${test_dir}"
          supabase init --force
          mkdir -p supabase/migrations supabase/tests
          cp "${GITHUB_WORKSPACE}/supabase/migrations/20261024142637_202610230003_multi_agent_message_queue.sql" supabase/migrations/
          cp "${GITHUB_WORKSPACE}/supabase/migrations/20261107010000_multi_agent_message_claim_fencing.sql" supabase/migrations/
          cp "${GITHUB_WORKSPACE}/supabase/tests/message_claim_fencing.test.sql" supabase/tests/

      - name: Start isolated PostgreSQL
        working-directory: ${{ runner.temp }}/jarvis-message-claim-fencing
        run: |
          supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Execute pgTAP behavior tests
        working-directory: ${{ runner.temp }}/jarvis-message-claim-fencing
        run: supabase test db supabase/tests/message_claim_fencing.test.sql

      - name: Export isolated Supabase API credentials
        working-directory: ${{ runner.temp }}/jarvis-message-claim-fencing
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          test -n "$API_URL"
          test -n "$SERVICE_ROLE_KEY"
          echo "JARVIS_E2E_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "JARVIS_E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Set up Python for process integration test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated integration test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt "supabase>=2.0.0"

      - name: Run two-process Supabase integration
        run: python -m pytest tests/multiagent/test_supabase_message_process_e2e.py -q

      - name: Stop isolated database
        if: always()
        working-directory: ${{ runner.temp }}/jarvis-message-claim-fencing
        run: supabase stop --no-backup || true
