name: Portas de navegador (testes)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/adapters/edge/portas_*.py"
      - "app/adapters/edge/jarvis_desktop_mcp.py"
      - "data/portas/**"
      - "tests/adapters/edge/test_portas_*.py"
      - "tests/fixtures/portas/**"
      - ".github/workflows/portas-browser-tests.yml"
  push:
    branches: [main]
    paths:
      - "app/adapters/edge/portas_*.py"
      - "data/portas/**"
      - "tests/adapters/edge/test_portas_*.py"
      - "tests/fixtures/portas/**"
      - ".github/workflows/portas-browser-tests.yml"

permissions:
  contents: read

jobs:
  unit:
    name: Unit (núcleo e vertentes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt -r requirements/edge.txt pytest playwright
      - name: Xvfb (pyautogui importa o pacote edge)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Testes unitários das portas
        run: |
          xvfb-run -a python -m pytest tests/adapters/edge/test_portas_visualizacao.py \
            tests/adapters/edge/test_portas_utilizacao.py -v -o addopts=""

  integration:
    name: Integração (Chromium via CDP)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt -r requirements/edge.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Xvfb (pyautogui importa o pacote edge)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Subir Chromium com depuração remota (somente localhost)
        run: |
          CHROME=$(python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()")
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/perfil-portas" about:blank > "$RUNNER_TEMP/chrome.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9222/json/version
      - name: Servir fixture local
        run: |
          (cd tests/fixtures/portas && python -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &)
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8000/index.html >/dev/null && break
            sleep 1
          done
      - name: Testes de integração
        env:
          PORTAS_CDP_URL: http://127.0.0.1:9222
          PORTAS_TEST_URL: http://127.0.0.1:8000/index.html
        run: |
          xvfb-run -a python -m pytest tests/adapters/edge/test_portas_cdp_integration.py -v -m integration -o addopts=""
