name: Repo Lifecycle Governance (preview)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run lifecycle governance in isolated runner checkout
        env:
          PIPELINE_STRICT: "false"
        run: |
          set -euo pipefail
          python scripts/repo_lifecycle_governance.py 2>&1 | tee repo_lifecycle_governance.log
          git add -N -- .
          git diff --binary -- . > repo_lifecycle_governance.patch
          git status --short > repo_lifecycle_governance_status.txt

      - name: Upload proposed changes and execution log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: repo-lifecycle-preview-${{ github.run_id }}
          path: |
            repo_lifecycle_governance.log
            repo_lifecycle_governance.patch
            repo_lifecycle_governance_status.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Repo lifecycle governance preview"
            echo ""
            echo "The script ran only in the ephemeral GitHub Actions checkout."
            echo "No commit or push was attempted; review the patch artifact before proposing changes."
          } >> "$GITHUB_STEP_SUMMARY"
