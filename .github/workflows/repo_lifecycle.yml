name: Repo Lifecycle Governance

on:
  workflow_dispatch:

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repo Lifecycle Governance
        env:
          PIPELINE_STRICT: "false"
        run: |
          echo "========================================"
          echo " Repo Lifecycle Governance"
          echo "========================================"
          set -o pipefail
          python scripts/repo_lifecycle_governance.py 2>&1 | tee repo_lifecycle_governance.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "❌ repo_lifecycle_governance.py falhou com código $EXIT_CODE"
            exit $EXIT_CODE
          fi
          if grep -qiE "error|fatal|traceback|exception" repo_lifecycle_governance.log; then
            echo "⚠️ repo_lifecycle_governance.py retornou mas contém avisos/erros no log."
          fi

      - name: Commit frozen changes (no PR, no merge)
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "governance-bot"
            git config user.email "governance@bot"
            git add .
            if ! git diff --staged --quiet; then
              git commit -m "chore: lifecycle governance (freeze/unfreeze)"
              git push
            else
              echo "Arquivos marcados, mas sem mudança para comitar."
            fi
          else
            echo "No changes to commit"
          fi