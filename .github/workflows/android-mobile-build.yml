name: Android Mobile Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-mobile-build.yml"
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-mobile-build.yml"

# PR and build jobs are read-only. Repository writes are isolated in the
# publication job, which never checks out or executes project code.
permissions:
  contents: read

jobs:
  assemble-debug:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble debug APK
        working-directory: mobile/android
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  build-release:
    name: Build signed release APK (trusted main only)
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    needs: assemble-debug
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      signing_configured: ${{ steps.release-signing.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Check release signing configuration
        id: release-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
              exit 1
            fi
            if [[ ! -s "$RUNNER_TEMP/release.jks" ]]; then
              echo "::error::Decoded Android keystore is empty."
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are incomplete; skipping signed release. The debug APK artifact remains available."
          fi
      - name: Assemble release APK
        if: steps.release-signing.outputs.configured == 'true'
        working-directory: mobile/android
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload signed release APK
        if: steps.release-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish signed release APK
    if: ${{ needs.build-release.outputs.signing_configured == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: jarvis-mobile-release-apk
          path: release-artifact
      - name: Publish release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release-artifact/app-release.apk jarvis-mobile.apk
          gh release create "mobile-build-${{ github.run_number }}" jarvis-mobile.apk \
            --title "Jarvis Mobile (build ${{ github.run_number }})" \
            --notes "APK gerado a partir de ${{ github.sha }}." \
            --latest
