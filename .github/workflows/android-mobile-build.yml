name: Android Mobile Build

on:
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-mobile-build.yml"
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-mobile-build.yml"

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble debug APK
        working-directory: mobile/android
        env:
          JARVIS_FCM_API_KEY: ${{ secrets.JARVIS_FCM_API_KEY }}
          JARVIS_FCM_APP_ID: ${{ secrets.JARVIS_FCM_APP_ID }}
          JARVIS_FCM_PROJECT_ID: ${{ secrets.JARVIS_FCM_PROJECT_ID }}
          JARVIS_FCM_SENDER_ID: ${{ secrets.JARVIS_FCM_SENDER_ID }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
