name: Android Mobile Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-mobile-build.yml"
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-mobile-build.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Report Firebase client configuration status
        env:
          JARVIS_FCM_API_KEY: ${{ secrets.JARVIS_FCM_API_KEY }}
          JARVIS_FCM_APP_ID: ${{ secrets.JARVIS_FCM_APP_ID }}
          JARVIS_FCM_PROJECT_ID: ${{ secrets.JARVIS_FCM_PROJECT_ID }}
          JARVIS_FCM_SENDER_ID: ${{ secrets.JARVIS_FCM_SENDER_ID }}
        shell: bash
        run: |
          if [[ -n "$JARVIS_FCM_API_KEY" && -n "$JARVIS_FCM_APP_ID" && -n "$JARVIS_FCM_PROJECT_ID" && -n "$JARVIS_FCM_SENDER_ID" ]]; then
            echo "FCM_CLIENT_CONFIGURED=true"
          else
            echo "FCM_CLIENT_CONFIGURED=false"
            echo "::warning::Firebase client configuration is incomplete; WebSocket can work but offline FCM registration will be unavailable."
          fi
      - name: Assemble debug APK
        working-directory: mobile/android
        env:
          JARVIS_FCM_API_KEY: ${{ secrets.JARVIS_FCM_API_KEY }}
          JARVIS_FCM_APP_ID: ${{ secrets.JARVIS_FCM_APP_ID }}
          JARVIS_FCM_PROJECT_ID: ${{ secrets.JARVIS_FCM_PROJECT_ID }}
          JARVIS_FCM_SENDER_ID: ${{ secrets.JARVIS_FCM_SENDER_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Check release signing configuration
        id: release-signing
        if: contains(fromJSON('["push","workflow_dispatch"]'), github.event_name)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
              exit 1
            fi
            if [[ ! -s "$RUNNER_TEMP/release.jks" ]]; then
              echo "::error::Decoded Android keystore is empty."
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are incomplete; skipping signed release. The debug APK artifact remains available."
          fi
      - name: Assemble release APK
        if: contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && steps.release-signing.outputs.configured == 'true'
        working-directory: mobile/android
        env:
          JARVIS_FCM_API_KEY: ${{ secrets.JARVIS_FCM_API_KEY }}
          JARVIS_FCM_APP_ID: ${{ secrets.JARVIS_FCM_APP_ID }}
          JARVIS_FCM_PROJECT_ID: ${{ secrets.JARVIS_FCM_PROJECT_ID }}
          JARVIS_FCM_SENDER_ID: ${{ secrets.JARVIS_FCM_SENDER_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Publish release APK
        if: contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && steps.release-signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk jarvis-mobile.apk
          gh release create "mobile-build-${{ github.run_number }}" jarvis-mobile.apk \
            --title "Jarvis Mobile (build ${{ github.run_number }})" \
            --notes "APK gerado a partir de ${{ github.sha }}." \
            --latest

