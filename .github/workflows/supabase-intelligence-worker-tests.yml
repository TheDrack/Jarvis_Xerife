name: Supabase intelligence worker lease tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261103184307_20261103100304_intelligence_history.sql"
      - "supabase/migrations/20261107025932_intelligence_recurring_worker.sql"
      - "supabase/tests/intelligence_worker_lease.test.sql"
      - ".github/workflows/supabase-intelligence-worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-intelligence-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intelligence-worker:
    name: PostgreSQL intelligence worker lease tests (isolated local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Assemble isolated intelligence history schema
        shell: bash
        run: |
          set -euo pipefail
          test_dir="${RUNNER_TEMP}/jarvis-intelligence-worker"
          mkdir -p "${test_dir}"
          cd "${test_dir}"
          supabase init --force
          mkdir -p supabase/migrations supabase/tests
          cp "${GITHUB_WORKSPACE}/supabase/migrations/20261103184307_20261103100304_intelligence_history.sql" supabase/migrations/
          cp "${GITHUB_WORKSPACE}/supabase/migrations/20261107025932_intelligence_recurring_worker.sql" supabase/migrations/
          cp "${GITHUB_WORKSPACE}/supabase/tests/intelligence_worker_lease.test.sql" supabase/tests/

      - name: Start isolated PostgreSQL
        working-directory: ${{ runner.temp }}/jarvis-intelligence-worker
        run: |
          supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Execute pgTAP behavior tests
        working-directory: ${{ runner.temp }}/jarvis-intelligence-worker
        run: supabase test db supabase/tests/intelligence_worker_lease.test.sql

      - name: Stop isolated database
        if: always()
        working-directory: ${{ runner.temp }}/jarvis-intelligence-worker
        run: supabase stop --no-backup || true
