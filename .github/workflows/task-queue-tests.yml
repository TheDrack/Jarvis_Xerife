name: Jarvis Task Queue Tests

on:
  pull_request:
    paths:
      - "app/application/services/agent_task_queue_service.py"
      - "app/adapters/infrastructure/routers/agent_tasks.py"
      - "app/adapters/infrastructure/api_server.py"
      - "tests/**"
      - "supabase/migrations/**"
      - "requirements/**"
      - ".github/workflows/task-queue-tests.yml"
  push:
    branches: [main]
    paths:
      - "app/application/services/agent_task_queue_service.py"
      - "app/adapters/infrastructure/routers/agent_tasks.py"
      - "app/adapters/infrastructure/api_server.py"
      - "tests/**"
      - "supabase/migrations/**"
      - "requirements/**"
      - ".github/workflows/task-queue-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-queue-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # The repository includes Windows-specific automation modules and tests.
    env:
      PYTHONIOENCODING: utf-8
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/dev.txt
            requirements/edge.txt
      - name: Install project test dependencies
        run: |
          python -m pip install -r requirements/dev.txt
          python -m pip install -r requirements/edge.txt
      - name: Compile changed Python modules
        run: python -m compileall -q app/application/services/agent_task_queue_service.py app/adapters/infrastructure/routers/agent_tasks.py app/adapters/infrastructure/api_server.py tests/application/test_agent_task_queue_service.py
      - name: Run task queue unit tests
        run: python -m pytest tests/application/test_agent_task_queue_service.py -q
      - name: Run full test suite
        run: python -m pytest -q
