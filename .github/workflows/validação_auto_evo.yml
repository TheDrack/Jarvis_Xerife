name: 🧬 Validação — Auto-Evolução e Multi-LLM

# Este workflow deve CONFERIR, não iniciar mutações.
# A criação de novas missões/evolução deve ficar com
# `auto_evolution_triggerV2.yml`.
on:
  workflow_dispatch:
    inputs:
      cap_id:
        description: "CAP cuja mudança deve ser conferida (ex: CAP-001). Deixe vazio para conferir o estado geral."
        required: false
        default: ""
        type: string
      run_tests:
        description: "Executar pytest?"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  diagnostico-llm:
    name: 🔍 Diagnóstico de LLMs
    runs-on: ubuntu-latest
    outputs:
      llms_ok: ${{ steps.check.outputs.llms_ok }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -q requests

      - name: 🔍 Checar LLMs e testar MetabolismCore
        id: check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -e

          python - <<'PYEOF'
          import os, sys, json
          sys.path.insert(0, ".")

          provedores = {
              "Groq":        "GROQ_API_KEY",
              "Gemini":      "GEMINI_API_KEY",
              "OpenRouter":  "OPENROUTER_API_KEY",
              "Mistral":     "MISTRAL_API_KEY",
          }

          resultado = {"llms_ok": "false"}
          print("=" * 45)
          disponiveis = 0
          for nome, env in provedores.items():
              key = os.getenv(env, "")
              ok = bool(key and len(key) > 10)
              print(f"{'✅' if ok else '❌'}  {nome} ({env})")
              if ok:
                  disponiveis += 1
          print(f"\nDisponíveis: {disponiveis}/{len(provedores)}")
          print("=" * 45)

          if disponiveis == 0:
              print("⛔ Nenhum secret de LLM configurado.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  json.dump(resultado, f)
                  f.write("\n")
              sys.exit(1)

          try:
              from app.core.nexus import nexus
              core = nexus.resolve("metabolism_core")
              result = core.ask_jarvis(
                  'Responda apenas JSON sem markdown.',
                  'Responda: {"status": "ok"}',
                  require_json=True,
              )
              print(f"✅ MetabolismCore OK → {result}")
              resultado["llms_ok"] = "true"
          except Exception as e:
              print(f"❌ MetabolismCore falhou: {e}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              json.dump(resultado, f)
              f.write("\n")

          if resultado["llms_ok"] != "true":
              sys.exit(1)
          PYEOF

  validar-stubs:
    name: 🔧 Validar estrutura de capabilities
    runs-on: ubuntu-latest
    needs: diagnostico-llm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 🔧 Corrigir stubs
        run: python scripts/fix_cap_stubs.py

      - name: 🔍 Verificar templates não expandidos
        run: |
          set -e
          python - <<'PYEOF'
          from pathlib import Path
          import sys
          problemas = [
              f.name for f in sorted(Path("app/domain/capabilities").glob("cap_*.py"))
              if "{cap['id']}" in f.read_text(encoding="utf-8")
              or "{target_dir}" in f.read_text(encoding="utf-8")
          ]
          if problemas:
              print(f"❌ {len(problemas)} arquivo(s) com template literal:")
              print("\n".join(f"  - {p}" for p in problemas))
              sys.exit(1)
          print("✅ Arquivos de capability validados.")
          PYEOF

  conferir-caps:
    name: 🧾 Conferir estado dos caps
    runs-on: ubuntu-latest
    needs: [validar-stubs, diagnostico-llm]
    if: ${{ github.event.inputs.cap_id != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Conferir CAP selecionado
        env:
          CAP_ID: ${{ github.event.inputs.cap_id }}
        run: |
          set -e
          python - <<'PYEOF'
          import json, os, sys
          from pathlib import Path

          cap_id = os.environ.get("CAP_ID", "").strip()
          if not cap_id:
              print("⚠️ Nenhum CAP informado.")
              sys.exit(0)

          caps_path = Path("data/capabilities.json")
          if not caps_path.exists():
              print("⚠️ data/capabilities.json não encontrado.")
              sys.exit(0)

          caps = json.loads(caps_path.read_text(encoding="utf-8")).get("capabilities", [])
          found = [c for c in caps if str(c.get("id")) == cap_id]
          if not found:
              print(f"⚠️ CAP {cap_id} não encontrado em data/capabilities.json.")
              sys.exit(0)

          cap = found[0]
          print(f"🧾 CAP selecionado para conferência: {cap_id}")
          print(f"- status: {cap.get('status')}")
          print(f"- title: {cap.get('title')}")
          print(f"- priority: {cap.get('priority')}")
          PYEOF

  testes:
    name: 🧪 Pytest
    runs-on: ubuntu-latest
    needs: validar-stubs
    if: ${{ github.event.inputs.run_tests == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependências de dev
        run: pip install -q pytest pytest-asyncio pytest-cov
      - name: 🧪 Rodar testes
        run: pytest tests/domain/ -v --tb=short

  relatorio-final:
    name: 📊 Relatório Final
    runs-on: ubuntu-latest
    needs: [diagnostico-llm, validar-stubs, conferir-caps, testes]
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 📊 Resumo final
        env:
          DIAGNOSTICO_LLM: ${{ needs.diagnostico-llm.result }}
          VALIDAR_STUBS: ${{ needs.validar-stubs.result }}
          CONFERIR_CAPS: ${{ needs.conferir-caps.result }}
          TESTES: ${{ needs.testes.result }}
        run: |
          set -e
          python - <<'PYEOF'
          import json, os, sys
          from pathlib import Path

          caps_path = Path("data/capabilities.json")
          caps = json.loads(
              caps_path.read_text(encoding="utf-8")
          ).get("capabilities", []) if caps_path.exists() else []

          total = len(caps)
          complete = sum(1 for c in caps if c.get("status") == "complete")

          print("=" * 50)
          print(f"📊 RELATÓRIO: {complete}/{total} completas")
          print(f"Diagnóstico LLM: {os.getenv('DIAGNOSTICO_LLM')}")
          print(f"Validação de stubs: {os.getenv('VALIDAR_STUBS')}")
          print(f"Conferência de CAP: {os.getenv('CONFERIR_CAPS')}")
          print(f"Testes: {os.getenv('TESTES')}")
          print("=" * 50)
          PYEOF
