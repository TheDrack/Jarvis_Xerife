name: keepalive

# Mantém o serviço Jarvis-api acordado no plano free do Render.
# Sem tráfego, o Render coloca a instância em repouso e o polling do Telegram para.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar e aquecer o Jarvis (/warmup)
        run: |
          curl -fsS --max-time 120 --retry 3 --retry-delay 10 \
            -o response.json -w "HTTP %{http_code}\n" \
            https://jarvis-api-c47i.onrender.com/warmup
          cat response.json
