name: 🚀 JARVIS Integrated Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  gate:
    name: "🚦 Gate de Evolução"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Verificar EVOLUTION_ENABLED
        id: check
        env:
          EVOLUTION_ENABLED: ${{ vars.EVOLUTION_ENABLED }}
        run: |
          if [ "${EVOLUTION_ENABLED}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ Auto-evolução habilitada."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ Auto-evolução pausada (EVOLUTION_ENABLED != true)."
          fi

  evolution_cycle:
    name: "🧪 Geração e validação isolada"
    needs: gate
    permissions:
      contents: read
    if: |
      github.ref == 'refs/heads/main' &&
      needs.gate.outputs.enabled == 'true' &&
      github.event_name != 'pull_request' &&
      !contains(github.event.head_commit.message, '[Auto-Evolution] DNA Mutated')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      artifact_available: ${{ steps.evolve.outputs.artifact_available }}
    steps:
      - name: 🛰️ Checkout trusted main (read-only credentials)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: 📦 Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.11'

      - name: 🧠 Orquestrador e identificação de missão
        id: flow
        env:
          EVOLUTION_ENABLED: ${{ vars.EVOLUTION_ENABLED }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv venv --clear --python 3.11
          source .venv/bin/activate
          uv pip install -r requirements.txt

          python - << 'PYCODE'
          import os
          import re
          import sys
          from app.application.services.roadmap_mission_selector import RoadmapMissionSelector

          try:
              selector = RoadmapMissionSelector()
              next_mission = selector.find_next_mission()
              github_output = os.environ["GITHUB_OUTPUT"]

              if not next_mission:
                  with open(github_output, "a", encoding="utf-8") as output:
                      output.write("action=idle\n")
                  print(f"⏸️ Nenhuma missão do Cognitive Roadmap aprovada: {selector.hold_reason}")
                  sys.exit(0)

              cap_id = str(next_mission.get("legacy_capability_id") or "").strip()
              mission_id = str(next_mission.get("criterion_id") or "").strip()
              mission_title = str(next_mission.get("title") or "").strip()
              target_file = str(next_mission.get("target_file") or "").strip()

              if not re.fullmatch(r"CAP-[0-9]+", cap_id):
                  with open(github_output, "a", encoding="utf-8") as output:
                      output.write("action=blocked\n")
                  print("⛔ Referência de compatibilidade CAP ausente ou inválida; evolução bloqueada.")
                  sys.exit(0)

              if not re.fullmatch(r"C[0-8]-[A-Z0-9]+(?:-[A-Z0-9]+)*", mission_id):
                  with open(github_output, "a", encoding="utf-8") as output:
                      output.write("action=blocked\n")
                  print("⛔ Criterion ID inválido; evolução bloqueada.")
                  sys.exit(0)

              if not target_file or not mission_title:
                  with open(github_output, "a", encoding="utf-8") as output:
                      output.write("action=blocked\n")
                  print("⛔ Metadados de alvo/título ausentes; evolução bloqueada.")
                  sys.exit(0)

              with open("mission_context.txt", "w", encoding="utf-8") as file:
                  file.write(next_mission["roadmap_context"])

              with open(github_output, "a", encoding="utf-8") as output:
                  output.write(f"cap_id={cap_id}\n")
                  output.write(f"mission_id={mission_id}\n")
                  output.write(f"mission_title={mission_title}\n")
                  output.write(f"target_file={target_file}\n")
                  output.write("action=evolve\n")
              print(f"🚀 Critério do roadmap selecionado: {mission_id} ({cap_id})")
          except Exception as exc:
              print(f"❌ Roadmap mission selector falhou de forma fechada: {exc}")
              sys.exit(1)
          PYCODE

      - name: 🔒 Build hardened candidate sandbox
        if: steps.flow.outputs.action == 'evolve'
        run: docker build --file Dockerfile.evolution-sandbox --tag jarvis-evolution-sandbox:ci .

      - name: 🧬 Gerar e validar candidato (sem credenciais GitHub)
        id: evolve
        if: steps.flow.outputs.action == 'evolve'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EVOLUTION_ENABLED: ${{ vars.EVOLUTION_ENABLED }}
          EVOLUTION_SANDBOX_IMAGE: jarvis-evolution-sandbox:ci
          EVOLUTION_ARTIFACT_DIR: ${{ runner.temp }}/jarvis-evolution-artifacts
          CAP_ID: ${{ steps.flow.outputs.cap_id }}
          MISSION_ID: ${{ steps.flow.outputs.mission_id }}
          MISSION_TITLE: ${{ steps.flow.outputs.mission_title }}
          TARGET_FILE: ${{ steps.flow.outputs.target_file }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source .venv/bin/activate
          python scripts/evolve_all_pending.py \
            --cap-id "$CAP_ID" \
            --mission-id "$MISSION_ID" \
            --mission-title "$MISSION_TITLE" \
            --max-attempts 3 \
            --target-file "$TARGET_FILE" \
            --roadmap-context "$(cat mission_context.txt)"

      - name: 📦 Upload validated candidate artifact
        if: steps.evolve.outputs.artifact_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-evolution-candidate
          path: ${{ runner.temp }}/jarvis-evolution-artifacts
          if-no-files-found: error
          retention-days: 1

  publish_candidate:
    name: "🔐 Publicação privilegiada"
    needs: evolution_cycle
    if: needs.evolution_cycle.outputs.artifact_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.publish.outputs.pr_number }}
      branch: ${{ steps.publish.outputs.branch }}
    steps:
      - name: 🛰️ Checkout trusted main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: 📥 Download validated artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-evolution-candidate
          path: ${{ runner.temp }}/jarvis-evolution-artifacts

      - name: 🔐 Publish validated patch (candidate is never executed here)
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GIT_PAT }}
          EXPECTED_EVOLUTION_SANDBOX_IMAGE: jarvis-evolution-sandbox:ci
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_validated_evolution.py \
            --artifact-dir "${{ runner.temp }}/jarvis-evolution-artifacts"