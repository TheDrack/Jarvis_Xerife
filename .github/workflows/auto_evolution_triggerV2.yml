name: 🚀 JARVIS Integrated Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  gate:
    name: "🚦 Gate de Evolução"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Verificar EVOLUTION_ENABLED
        id: check
        env:
          EVOLUTION_ENABLED: ${{ vars.EVOLUTION_ENABLED }}
        run: |
          if [ "${EVOLUTION_ENABLED}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ Auto-evolução habilitada."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ Auto-evolução pausada (EVOLUTION_ENABLED != true)."
          fi

  evolution_cycle:
    name: "🧪 Geração e validação isolada"
    needs: gate
    permissions:
      contents: read
    if: |
      github.ref == 'refs/heads/main' &&
      needs.gate.outputs.enabled == 'true' &&
      github.event_name != 'pull_request' &&
      !contains(github.event.head_commit.message, '[Auto-Evolution] DNA Mutated')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      artifact_available: ${{ steps.evolve.outputs.artifact_available }}
    steps:
      - name: 🛰️ Checkout trusted main (read-only credentials)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: 📦 Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.11'

      - name: 🧠 Orquestrador e identificação de missão
        id: flow
        env:
          EVOLUTION_ENABLED: ${{ vars.EVOLUTION_ENABLED }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv venv --clear --python 3.11
          source .venv/bin/activate
          uv pip install -r requirements.txt

          python - << 'PYCODE'
          import os
          import re
          import sys
          from app.application.services.auto_evolutionV2 import AutoEvolutionServiceV2

          try:
              auto = AutoEvolutionServiceV2()
              github_output = os.environ["GITHUB_OUTPUT"]
              last_msg = os.popen("git log -1 --pretty=%B").read()
              print(f"--- ANALISANDO DNA ---\nMsg: {last_msg.strip()}")

              is_auto_evolution = bool(
                  re.search(r"auto-evolution|mission-\d+", last_msg, re.IGNORECASE)
              )
              is_sync = "Inventory Synchronized" in last_msg

              if is_auto_evolution and not is_sync:
                  print("🎯 DNA de Evolução detectado. Sincronizando inventário...")
                  match = re.search(r"CAP-\d+", last_msg)
                  if match and auto.mark_mission_as_completed(match.group()):
                      print(f"✅ Missão {match.group()} integrada com sucesso.")
                  with open(github_output, "a", encoding="utf-8") as output:
                      output.write("action=idle\n")
                  sys.exit(0)

              print("🟢 Buscando próxima mutação na apostila de aprendizado...")
              next_mission = auto.find_next_mission()
              if next_mission and next_mission.get("status") == "blocked":
                  with open(github_output, "a", encoding="utf-8") as output:
                      output.write("action=blocked\n")
                  print(
                      "⛔ Selector do Cognitive Roadmap bloqueou a execução: "
                      + str(next_mission.get("reason") or "unknown")
                  )
                  sys.exit(0)

              if not next_mission:
                  with open(github_output, "a", encoding="utf-8") as output:
                      output.write("action=idle\n")
                  print("😴 Todas as missões aprovadas do roadmap foram concluídas.")
                  sys.exit(0)

              mission_id = str(next_mission.get("id") or "").strip()
              if not re.fullmatch(r"C[0-8]-[0-9]{3}", mission_id):
                  with open(github_output, "a", encoding="utf-8") as output:
                      output.write("action=blocked\n")
                  print("⛔ Identificador de missão do roadmap ausente ou inválido.")
                  sys.exit(0)

              context = auto.get_roadmap_context(next_mission)
              with open("mission_context.txt", "w", encoding="utf-8") as file:
                  file.write(context)

              target_file = str(next_mission.get("target_file") or "").strip()
              if (
                  not re.fullmatch(r"[A-Za-z0-9_./-]+", target_file)
                  or any(part in {"", ".", ".."} for part in target_file.split("/"))
              ):
                  with open(github_output, "a", encoding="utf-8") as output:
                      output.write("action=blocked\n")
                  print(
                      "⛔ Missão sem target_file confiável; LLM e sandbox não serão executados."
                  )
                  sys.exit(0)

              with open(github_output, "a", encoding="utf-8") as output:
                  output.write(f"mission_id={mission_id}\n")
                  output.write(f"target_file={target_file}\n")
                  output.write("action=evolve\n")
              print(f"🚀 Missão do roadmap identificada: {mission_id}")
          except Exception as exc:
              print(f"❌ Falha no Orquestrador: {exc}")
              sys.exit(1)
          PYCODE

      - name: 🔒 Build hardened candidate sandbox
        if: steps.flow.outputs.action == 'evolve'
        run: docker build --file Dockerfile.evolution-sandbox --tag jarvis-evolution-sandbox:ci .

      - name: 🧬 Gerar e validar candidato (sem credenciais GitHub)
        id: evolve
        if: steps.flow.outputs.action == 'evolve'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EVOLUTION_ENABLED: ${{ vars.EVOLUTION_ENABLED }}
          EVOLUTION_SANDBOX_IMAGE: jarvis-evolution-sandbox:ci
          EVOLUTION_ARTIFACT_DIR: ${{ runner.temp }}/jarvis-evolution-artifacts
          MISSION_ID: ${{ steps.flow.outputs.mission_id }}
          TARGET_FILE: ${{ steps.flow.outputs.target_file }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source .venv/bin/activate
          python scripts/evolve_all_pending.py \
            --mission-id "$MISSION_ID" \
            --max-attempts 3 \
            --target-file "$TARGET_FILE" \
            --roadmap-context "$(cat mission_context.txt)"

      - name: 📦 Upload validated candidate artifact
        if: steps.evolve.outputs.artifact_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-evolution-candidate
          path: ${{ runner.temp }}/jarvis-evolution-artifacts
          if-no-files-found: error
          retention-days: 1

  publish_candidate:
    name: "🔐 Publicação privilegiada"
    needs: evolution_cycle
    if: needs.evolution_cycle.outputs.artifact_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.publish.outputs.pr_number }}
      branch: ${{ steps.publish.outputs.branch }}
    steps:
      - name: 🛰️ Checkout trusted main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: 📥 Download validated artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-evolution-candidate
          path: ${{ runner.temp }}/jarvis-evolution-artifacts

      - name: 🔐 Publish validated patch (candidate is never executed here)
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GIT_PAT }}
          EXPECTED_EVOLUTION_SANDBOX_IMAGE: jarvis-evolution-sandbox:ci
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_validated_evolution.py \
            --artifact-dir "${{ runner.temp }}/jarvis-evolution-artifacts"