name: Supabase evolution rewards ACL tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261105100000_evolution_rewards_least_privilege.sql"
      - "supabase/tests/evolution_rewards_least_privilege.test.sql"
      - ".github/workflows/supabase-evolution-rewards-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-evolution-rewards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    name: PostgreSQL ACL tests (isolated local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Assemble isolated migration fixture
        shell: bash
        run: |
          set -euo pipefail
          test_dir="${RUNNER_TEMP}/jarvis-evolution-rewards"
          mkdir -p "${test_dir}"
          cd "${test_dir}"
          supabase init --force
          mkdir -p supabase/migrations supabase/tests
          cp "${GITHUB_WORKSPACE}/.github/test-fixtures/evolution_rewards_fixture.sql" supabase/migrations/20261001000000_fixture_evolution_rewards.sql
          cp "${GITHUB_WORKSPACE}/supabase/migrations/20261105100000_evolution_rewards_least_privilege.sql" supabase/migrations/
          cp "${GITHUB_WORKSPACE}/supabase/tests/evolution_rewards_least_privilege.test.sql" supabase/tests/

      - name: Start isolated PostgreSQL
        working-directory: ${{ runner.temp }}/jarvis-evolution-rewards
        run: |
          supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Execute pgTAP ACL tests
        working-directory: ${{ runner.temp }}/jarvis-evolution-rewards
        run: supabase test db supabase/tests/evolution_rewards_least_privilege.test.sql

      - name: Stop isolated database
        if: always()
        working-directory: ${{ runner.temp }}/jarvis-evolution-rewards
        run: supabase stop --no-backup || true
