name: 🏗️ Auto-Documentation JARVIS

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/autodoc.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-autodoc-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate active module map
        run: python scripts/autodoc.py

      - name: Commit generated documentation
        run: |
          set -e

          if [ ! -f docs/ARQUIVO_MAP.md ]; then
            echo "docs/ARQUIVO_MAP.md was not generated"
            exit 1
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/ARQUIVO_MAP.md

          if git diff --quiet --cached -- docs/ARQUIVO_MAP.md; then
            echo "No module-map changes."
            exit 0
          fi

          git commit -m "docs: update generated module map [skip ci]"
          git push
