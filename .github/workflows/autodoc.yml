name: 🏗️ Auto-Documentation JARVIS

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/autodoc.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ Gerar mapa de arquitetura
        run: python scripts/autodoc.py

      - name: 💾 Commit da documentação
        run: |
          set -e

          if [ ! -f ARCHITECTURE.md ]; then
            echo "❌ O script não gerou ARCHITECTURE.md"
            exit 1
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add ARCHITECTURE.md

          if git diff --quiet --cached ARCHITECTURE.md; then
            echo "𝑁𝑒𝑛𝑕𝑖𝑚 𝑐𝑎𝑚𝑏𝑖𝑎𝑚𝑒𝑛𝑡𝑜 𝑟𝑒𝑎𝑙 𝑛𝑎 𝑑𝑜𝑐𝑢𝑚𝑒𝑛𝑡𝑎çã𝑜."
            exit 0
          fi

          git commit -m "docs: 🤖 mapa de arquitetura atualizado [skip ci]"
          git push
