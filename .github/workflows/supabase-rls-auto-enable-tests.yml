name: Supabase RLS auto-enable ACL tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261105093046_rls_auto_enable_execute_acl.sql"
      - "supabase/tests/rls_auto_enable_execute_acl.test.sql"
      - ".github/workflows/supabase-rls-auto-enable-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-rls-auto-enable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    name: PostgreSQL event-trigger ACL tests (isolated local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Assemble isolated migration fixture
        shell: bash
        run: |
          set -euo pipefail
          test_dir="${RUNNER_TEMP}/jarvis-rls-auto-enable"
          mkdir -p "${test_dir}"
          cd "${test_dir}"
          supabase init --force
          mkdir -p supabase/migrations supabase/tests
          cp "${GITHUB_WORKSPACE}/.github/test-fixtures/rls_auto_enable_fixture.sql" supabase/migrations/20261001000000_fixture_rls_auto_enable.sql
          cp "${GITHUB_WORKSPACE}/supabase/migrations/20261105093046_rls_auto_enable_execute_acl.sql" supabase/migrations/
          cp "${GITHUB_WORKSPACE}/supabase/tests/rls_auto_enable_execute_acl.test.sql" supabase/tests/

      - name: Start isolated PostgreSQL
        working-directory: ${{ runner.temp }}/jarvis-rls-auto-enable
        run: |
          supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Execute pgTAP event-trigger tests
        working-directory: ${{ runner.temp }}/jarvis-rls-auto-enable
        run: supabase test db supabase/tests/rls_auto_enable_execute_acl.test.sql

      - name: Stop isolated database
        if: always()
        working-directory: ${{ runner.temp }}/jarvis-rls-auto-enable
        run: supabase stop --no-backup || true
