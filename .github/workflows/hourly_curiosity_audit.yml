name: "🧭 JARVIS Hourly Curiosity Audit"

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-hourly-curiosity-audit
  cancel-in-progress: false

jobs:
  audit:
    name: "Read-only code, tests, and roadmap audit"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # pytest-asyncio registra o marcador 'asyncio' exigido por pytest.ini (--strict-markers);
          # Pillow e opencv (cv2) são usados por tests/adapters/edge. Só o necessário para headless.
          pip install pytest 'pytest-asyncio>=0.23.0' pytest-cov pytest-mock anyio Pillow opencv-python-headless

      - name: Run full test suite
        id: tests
        continue-on-error: true
        run: |
          mkdir -p audit-output
          set +e
          pytest -q 2>&1 | tee audit-output/pytest.log
          test_status=${PIPESTATUS[0]}
          echo "pytest_exit_code=$test_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build curiosity and roadmap report
        if: always()
        run: python scripts/hourly_curiosity_audit.py

      - name: Upload report and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-hourly-curiosity-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30

      - name: Fail the workflow if tests failed
        if: steps.tests.outputs.pytest_exit_code != '0'
        run: |
          echo "The hourly audit found failing tests. Review the uploaded report and pytest log."
          exit 1
