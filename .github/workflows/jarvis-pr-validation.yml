name: "JARVIS PR Validation (unprivileged)"

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: jarvis-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: "Full pytest suite (no secrets, read-only)"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install complete test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest 'pytest-asyncio>=0.23.0' pytest-cov pytest-mock anyio Pillow opencv-python-headless

      - name: Run complete pytest suite
        run: pytest -q
