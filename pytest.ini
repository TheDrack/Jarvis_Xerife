[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short

# Coverage is opt-in to keep local "pytest" runs fast.
# Run with coverage explicitly:  pytest --cov=app --cov-report=term-missing --cov-report=html

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    anyio: Async tests using anyio
